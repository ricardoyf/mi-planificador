<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planificador de Comidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-title-block">
            <h1>Planificador</h1>
            <div id="week-summary" class="week-summary">Semana actual</div>
        </div>
        <div class="header-actions">
            <select id="week-select" class="week-select"></select>
            <div class="menu-container">
            <button id="menu-btn" class="icon-btn">⋮</button>
            <div id="dropdown-menu" class="dropdown hidden">
                <button onclick="app.loadJsonFile()">Cargar JSON</button>
                <button onclick="app.savePlanAsJson()">Guardar JSON</button>
                <hr>
                <button onclick="app.action('load', 'par')">Cargar PAR</button>
                <button onclick="app.action('load', 'impar')">Cargar IMPAR</button>
                <button onclick="app.action('save', 'par')">Guardar como PAR</button>
                <button onclick="app.action('save', 'impar')">Guardar como IMPAR</button>
                <hr>
                <button onclick="app.exportHTML()">Exportar HTML</button>
                <input type="file" id="json-file-input" accept="application/json,.json" style="display:none"> 
            </div>
        </div>
    </header>

    <main id="main-content">
        <!-- View: Planificador -->
        <section id="view-planificador" class="view active">
            <div class="days-container" id="days-container"></div>
        </section>

        <!-- View: Platos -->
        <section id="view-platos" class="view">
            <div class="search-bar">
                <input type="text" id="search-platos" placeholder="Buscar platos...">
            </div>
            <div class="platos-container" id="platos-container"></div>
        </section>

        <!-- View: Recetario -->
        <section id="view-recetario" class="view">
            <div class="search-bar">
                <input type="text" id="search-recetas" placeholder="Buscar recetas...">
            </div>
            <div class="recetas-container" id="recetas-container"></div>
        </section>

        <!-- View: Compra -->
        <section id="view-compra" class="view" style="padding-bottom: 2rem;">
            <div class="day-header" style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <span>Cálculo de la Compra</span>
                <button onclick="app.copyCompra()" class="icon-btn" style="font-size: 14px; padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; background: white; color: #111;">Copiar Lista</button>
            </div>
            <div class="platos-container" id="compra-container">
                <!-- Se llena dinamica con js -->
            </div>
        </section>
    </main>

    <!-- Floating Action - Plato Seleccionado -->
    <div id="selected-plato-fab" class="fab hidden">
        <span>Seleccionado: <strong id="selected-plato-name">Ninguno</strong></span>
        <button onclick="app.clearSelection()">✕</button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="view-planificador">📅 <span>Plan</span></button>
        <button class="nav-item" data-target="view-platos">🍲 <span>Platos</span></button>
        <button class="nav-item" data-target="view-recetario">📖 <span>Recetario</span></button>
        <button class="nav-item" data-target="view-compra">🛒 <span>Compra</span></button>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
