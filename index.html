<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanComidas v8.4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="top">
            <div class="head-left">
                <div class="title">PlanComidas</div>
                <div class="badge">v8.4</div>
                <div id="week-summary" class="week-summary">Semana actual</div>
            </div>
            <div class="head-actions menu-container">
                <button id="menu-btn" class="icon-btn" type="button" aria-label="Menú">⋮</button>
                <div id="dropdown-menu" class="dropdown hidden">
                    <button class="menu-item" onclick="app.copyCompactaYCompra()">Copiar plan + compra<span>Texto listo para email o WhatsApp</span></button>
                    <button class="menu-item" onclick="app.savePlanAsJson()">Exportar plan semanal<span>JSON de la semana actual para compartir</span></button>
                    <button class="menu-item" onclick="app.exportRecipesJson()">Exportar recetario<span>JSON completo de recetas y ListaCompra</span></button>
                    <button class="menu-item" onclick="app.chooseImportFile('week')">Importar plan semanal<span>Elegir archivo JSON</span></button>
                    <button class="menu-item" onclick="app.chooseImportFile('recipes')">Importar recetario<span>Elegir archivo JSON</span></button>
                    <button class="menu-item" onclick="app.chooseImportFile('html')">Importar receta HTML Paprika<span>Elegir archivo HTML exportado</span></button>
                    <button class="menu-item" onclick="app.chooseImportFile('txt')">Importar receta TXT Paprika<span>Elegir texto copiado/exportado</span></button>
                    <input type="file" id="json-file-input" accept=".json,.html,.htm,.txt,application/json,text/html,text/plain" style="display:none">
                </div>
            </div>
        </div>
    </header>

    <main id="main-content">
        <section id="view-compacta" class="view active"></section>
        <section id="view-recetario" class="view">
            <div class="search-bar">
                <input type="text" id="search-recetas" placeholder="Buscar recetas...">
            </div>
            <div class="platos-container" id="recetas-container"></div>
        </section>
    </main>

    <div id="slot-modal" class="modal">
        <div class="sheet">
            <div class="bar">
                <strong id="slot-title">Elegir plato</strong>
                <button class="btn secondary" type="button" onclick="app.closeSlotModal()">Cerrar</button>
            </div>
            <input id="dish-search" placeholder="Buscar plato o receta">
            <div id="dish-results"></div>
        </div>
    </div>

    <div id="shopping-modal" class="modal">
        <div class="sheet">
            <div class="bar">
                <strong id="shopping-title">Item de compra</strong>
                <button class="btn secondary" type="button" onclick="app.closeShoppingModal()">Cerrar</button>
            </div>
            <input id="shopping-edit-input" placeholder="Item">
            <button class="choice" type="button" onclick="app.saveShoppingEdit()"><strong>Guardar edición</strong><span>Cambiar el texto de este item</span></button>
            <button class="choice" type="button" onclick="app.deleteShoppingSelected()"><strong>Borrar</strong><span>Ocultarlo de esta lista semanal</span></button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="view-compacta"><span class="nav-ico nav-ico-grid"></span>Compacta</button>
        <button class="nav-item" data-target="view-recetario"><span class="nav-ico nav-ico-rec"></span>Recetario</button>
    </nav>

    <script src="js/data.js?v=20260725f"></script>
    <script src="js/app.js?v=20260725f"></script>
</body>
</html>
